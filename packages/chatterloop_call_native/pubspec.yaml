name: chatterloop_call_native
description: >-
  Native call support for Chatterloop - the app-played ringtone, the
  ongoing-call notification, and picture-in-picture.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.chatterloop.callnative
        pluginClass: CallNativePlugin
      ios:
        pluginClass: CallNativePlugin

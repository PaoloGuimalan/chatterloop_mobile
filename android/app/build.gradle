plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.chatterloop.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    dependencies {
        implementation "com.google.android.material:material:1.13.0-alpha08"
        // ShortcutManagerCompat / ShortcutInfoCompat / Person / IconCompat,
        // used by ConversationShortcuts.kt. Reaches the classpath transitively
        // via the Flutter embedding too, but conversation shortcuts are the
        // only reason any of it is compiled against directly - so declare it
        // rather than depend on someone else's transitive graph.
        implementation "androidx.core:core-ktx:1.13.1"
        // flutter_local_notifications 19.x uses java.time APIs that require
        // core library desugaring to run on the app's minSdk (23).
        coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    }


    compileOptions {
        // Enables the desugared java.time backport used above.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.chatterloop.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // record_android requires minSdk 23 (Android 6.0) - bumped from
        // Flutter's own default (flutter.minSdkVersion, 21) per its own
        // manifest-merger error/suggested fix. Drops support for
        // Android 5.0/5.1 devices, which are vanishingly rare at this point.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Signed with the UPLOAD KEY when one is configured, and only then.
            //
            // Play rejects an artifact signed with the debug key, which is what
            // this used to do unconditionally - so every release build looked
            // fine locally and could never have been uploaded.
            //
            // The fallback is deliberate rather than lazy. key.properties and
            // the .jks are both gitignored (see android/.gitignore), so they
            // exist on the release machine and nowhere else; a hard switch to
            // signingConfigs.release would break `flutter build --release` for
            // any other checkout - CI, a second machine, a contributor - with a
            // null storeFile rather than a message. Falling back keeps those
            // builds working for local testing while making it impossible to
            // ship one by accident, because an unsigned-for-release artifact is
            // refused at upload.
            //
            // `storeFile` is the thing tested, not the file's existence: it is
            // null exactly when key.properties was missing or had no storeFile
            // entry, which is the case the fallback is for. A configured path
            // that does not resolve SHOULD fail the build loudly - that is a
            // broken release setup, not an absent one.
            if (signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            } else {
                // project.logger, not a bare `logger`: inside a buildTypes
                // closure the delegate is the BuildType, which has no such
                // property, so the bare form only resolves by falling through
                // Groovy's owner chain to the script. That works today and is
                // not worth depending on - especially here, since this branch
                // ONLY runs on a machine without key.properties, i.e. the one
                // place nobody would be watching for a Groovy resolution error.
                project.logger.warn("WARNING: android/key.properties not found - the release " +
                                    "build will be signed with the DEBUG key and cannot be " +
                                    "uploaded to Play.")
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}

name: chatterloop_app
description: "A Mobile version of Chatterloop."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_redux: ^0.10.0
  redux: ^5.0.0
  dio: ^5.7.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  dart_jsonwebtoken: ^3.4.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  # Third-party (Google) auth - mirrors the webapp's @react-oauth/google
  # flow: obtain a Google ID token natively, then POST it to the Django
  # /api/user/tp_auth endpoint (auto-login/auto-signup). serverClientId must
  # be the SAME web OAuth client the webapp uses so the token audience
  # matches what the server verifies.
  google_sign_in: ^7.2.0
  video_player: ^2.5.1
  http: ^1.2.2
  flutter_client_sse: ^2.0.3
  go_router: ^17.3.0
  image_picker: ^1.2.0
  event_bus: ^2.0.1
  audioplayers: ^6.1.0
  emoji_picker_flutter: ^4.3.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  file_picker: ^11.0.3
  record: ^7.1.1
  path_provider: ^2.1.4
  visibility_detector: ^0.4.0+2
  # Data & Privacy export - the mobile equivalent of the webapp's file
  # download is the native share sheet (save to Files/Drive/send).
  # Held at 12: share_plus >=13.1 needs win32 ^6 while file_picker <12 needs
  # win32 ^5, and they cannot both be satisfied. The conflict is over a
  # WINDOWS-only transitive dependency that this app never builds, but pub
  # enforces it anyway. file_picker's upgrade (Android 13+ media permissions)
  # is worth more than share_plus's, so that one wins until file_picker 12
  # leaves beta.
  share_plus: ^12.0.2

  # Calling feature (M0 viability spike) - webapp's calls_v2 is built on
  # mediasoup (an SFU), not plain WebRTC offer/answer, and the server's
  # /webrtc/* endpoints only speak mediasoup's protocol - so a generic
  # flutter_webrtc-only client can't interop with it. mediasoup_client_flutter
  # pins flutter_webrtc ^0.9.33 (five majors behind current 1.5.2); pinned
  # here to match until this spike proves whether that's actually viable.
  flutter_webrtc: 0.9.48+hotfix.1
  mediasoup_client_flutter: ^0.8.5

  # for android push notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.2.0

  # Circle-cropping notification avatars. flutter_local_notifications builds
  # Person icons with IconCompat.createWithBitmap, NOT createWithAdaptiveBitmap
  # - only the latter gets circle-masked by Android - so a bitmap renders
  # exactly as handed over, i.e. square. Cropping has to happen before the
  # bytes reach the plugin. Pure Dart, so it also works inside the FCM
  # background isolate, where dart:ui rendering is not dependable. Already
  # present transitively, so promoting it to a direct dependency adds nothing
  # to the build.
  image: ^4.9.1
  # Rich-text diary entries. Fleather rather than flutter_quill: every
  # flutter_quill version (10 and 11 alike) drags in quill_native_bridge_windows
  # 0.0.2, whose only published release calls a bare `GMEM_MOVEABLE` that NO
  # published win32 defines - 5.4/5.5 spell it GMEM_MOVABLE, 5.8+ expose it
  # only as GLOBAL_ALLOC_FLAGS.GMEM_MOVEABLE. That breaks the ANDROID build,
  # because Flutter's generated Dart plugin registrant imports every endorsed
  # federated implementation regardless of the target platform.
  #
  # Fleather is a Quill descendant with no native bridges at all (three pure
  # Dart packages), and parchment ships a BIDIRECTIONAL HTML codec, so entries
  # convert both ways rather than one - which also means an edit screen stays
  # possible if the API ever grows a PUT.
  fleather: ^1.22.0
  # Fleather's document model, imported directly for its HTML codec.
  parchment: ^1.22.0
  # Renders web-authored entry HTML on the read side.
  flutter_widget_from_html_core: ^0.17.2
  video_thumbnail: ^0.5.6

dependency_overrides:
  # PINNED, not merely constrained, because nothing in the tree constrains it
  # correctly: flutter_webrtc asks for `^1.1.2`, which happily resolves to
  # 1.5.1 - and 1.5.1 changed the API that mediasoup_client_flutter 0.8.5
  # subclasses. RTCRtpEncoding.priority became RTCPriorityType (it was the
  # package's own `Priority`) and Rtcp.cname became non-nullable, so the
  # PRISTINE package no longer compiles:
  #
  #   rtp_parameters.dart:406: The return type of 'RtpEncodingParameters
  #   .priority' is 'Priority?', which does not match ... 'RTCPriorityType'
  #
  # mediasoup_client_flutter is effectively unmaintained (0.8.5 still pins
  # flutter_webrtc ^0.9.33, five majors back - see the note on that dependency
  # above), so there is no newer release to move to. 1.1.2 is the API it was
  # written against, and the whole app builds green on it.
  #
  # NOTE: this is what made the build machine-dependent for a while - one
  # machine had a hand-edited copy of mediasoup in its pub cache that
  # compiled against 1.5.1, so it built there and nowhere else. With this
  # pin the published package is used everywhere and no local edit is needed.
  webrtc_interface: 1.1.2

  # VENDORED, with one patch: the published 0.9.48+hotfix.1 still carries
  # Flutter's V1 embedding entry point, and Flutter removed
  # PluginRegistry.Registrar from the engine - so the Android build now fails
  # on a method nothing has called in years:
  #
  #   FlutterWebRTCPlugin.java:25: error: cannot find symbol
  #   import io.flutter.plugin.common.PluginRegistry.Registrar;
  #
  # patched/flutter_webrtc is that package with the import and the dead
  # registerWith(Registrar) method deleted - ONE file, one hunk, nothing else.
  #
  # Why a copy rather than a version bump: mediasoup_client_flutter 0.8.5 pins
  # flutter_webrtc ^0.9.33 (i.e. <0.10.0) and is unmaintained. The upstream
  # commit that removed the V1 plugin (d266f02, 0.12.9) needs
  # webrtc_interface >=1.2.1, where Rtcp.cname is already non-nullable - which
  # mediasoup does not compile against. Verified by building it: the priority
  # errors cleared and the cname ones did not. There is no version pair that
  # satisfies both, so the patch has to live somewhere, and in the repo is the
  # only place every machine sees it.
  #
  # Trimmed of third_party/ (57MB of libwebrtc prebuilts) and example/. Android
  # takes libwebrtc from Maven (io.github.webrtc-sdk:android) and iOS from the
  # WebRTC-SDK pod, so neither is used here. NOTE: those prebuilts ARE what
  # windows/ and linux/ CMakeLists reference, so this copy cannot build the
  # desktop embedders. Android and iOS only.
  #
  # This replaces a hand-edited copy that existed in ONE developer's pub cache
  # and nowhere else - which is why the build passed there and failed on every
  # other machine.
  flutter_webrtc:
    path: patched/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  # Test-only: post_video_test fakes VideoPlayerPlatform so a video can reach
  # its initialized state without a device. Already present transitively via
  # video_player; declared here because the test imports it directly.
  video_player_platform_interface: ^6.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
